<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glowPurple" cx="10%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnit="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.18" />
      <circle cx="40" cy="0" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <!-- Linear Accents -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="30%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Rect -->
  <rect width="850" height="250" fill="url(#bgGrad)" />

  <!-- Glows -->
  <rect width="850" height="250" fill="url(#glowPurple)" />
  <rect width="850" height="250" fill="url(#glowCyan)" />
  <rect width="850" height="250" fill="url(#glowBlue)" />

  <!-- Grid overlay -->
  <rect width="850" height="250" fill="url(#grid)" />

  <!-- Decorative geometric lines -->
  <path d="M-100,50 L950,50" stroke="url(#lineGrad)" stroke-width="1.5" />
  <path d="M-100,200 L950,200" stroke="url(#lineGrad)" stroke-width="1.5" />

  <!-- Abstract Tech Accents (dots) -->
  <g opacity="0.6">
    <circle cx="100" cy="125" r="3" fill="#7c3aed" />
    <line x1="100" y1="125" x2="200" y2="125" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="750" cy="125" r="3" fill="#06b6d4" />
    <line x1="650" y1="125" x2="750" y2="125" stroke="#06b6d4" stroke-dasharray="4,4" stroke-width="1" />
  </g>

  <!-- Centered Branding Text -->
  <g text-anchor="middle" dominant-baseline="middle">
    <!-- Title -->
    <text x="425" y="105" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="6">
      JAITHRA ADDEPALLI
    </text>
    
    <!-- Subheading -->
    <text x="425" y="145" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" letter-spacing="1">
      Python Developer  //  Full Stack Developer  //  AI Enthusiast
    </text>

    <!-- Visual details -->
    <text x="425" y="175" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="4" opacity="0.8">
      BUILDING DIGITAL INTELLIGENCE
    </text>
  </g>

  <!-- Top-left terminal window controls (Apple style) -->
  <g transform="translate(20, 20)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="15" cy="0" r="5" fill="#f59e0b" />
    <circle cx="30" cy="0" r="5" fill="#10b981" />
  </g>
</svg>
