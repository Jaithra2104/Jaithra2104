<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="100%" height="100%">
  <style>
    .terminal-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 15px;
      fill: #f1f5f9;
    }
    .prompt {
      fill: #06b6d4;
      font-weight: bold;
    }
    .cursor {
      fill: #a78bfa;
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .typed-text {
      opacity: 0;
      animation: cycleTexts 15s infinite;
    }
    .text-1 { animation-delay: 0s; }
    .text-2 { animation-delay: 3s; }
    .text-3 { animation-delay: 6s; }
    .text-4 { animation-delay: 9s; }
    .text-5 { animation-delay: 12s; }

    @keyframes cycleTexts {
      0%, 18% { opacity: 1; }
      18.0001%, 100% { opacity: 0; }
    }

    /* Typewriter effect using clip-path width animation */
    .clip-rect {
      animation: type 3s infinite;
    }
    .clip-1 { animation-delay: 0s; }
    .clip-2 { animation-delay: 3s; }
    .clip-3 { animation-delay: 6s; }
    .clip-4 { animation-delay: 9s; }
    .clip-5 { animation-delay: 12s; }

    @keyframes type {
      0% { width: 0; }
      40%, 85% { width: 380px; }
      95%, 100% { width: 0; }
    }
  </style>

  <defs>
    <clipPath id="clip1"><rect class="clip-rect clip-1" x="210" y="0" width="0" height="60" /></clipPath>
    <clipPath id="clip2"><rect class="clip-rect clip-2" x="210" y="0" width="0" height="60" /></clipPath>
    <clipPath id="clip3"><rect class="clip-rect clip-3" x="210" y="0" width="0" height="60" /></clipPath>
    <clipPath id="clip4"><rect class="clip-rect clip-4" x="210" y="0" width="0" height="60" /></clipPath>
    <clipPath id="clip5"><rect class="clip-rect clip-5" x="210" y="0" width="0" height="60" /></clipPath>
  </defs>

  <!-- Terminal Background Pill -->
  <rect width="600" height="60" rx="12" fill="#080c14" stroke="#1e293b" stroke-width="1.5" />

  <!-- Apple Window Dots -->
  <g transform="translate(20, 30)">
    <circle cx="0" cy="0" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="12" cy="0" r="4" fill="#f59e0b" opacity="0.8" />
    <circle cx="24" cy="0" r="4" fill="#10b981" opacity="0.8" />
  </g>

  <!-- Terminal Text Prompt -->
  <text x="65" y="35" class="terminal-text prompt">jaithra@developer:~$</text>

  <!-- Typing Texts -->
  <g class="terminal-text">
    <g clip-path="url(#clip1)">
      <text x="210" y="35" class="typed-text text-1">Building AI Applications...<tspan class="cursor">█</tspan></text>
    </g>
    <g clip-path="url(#clip2)">
      <text x="210" y="35" class="typed-text text-2">Creating Automation Systems...<tspan class="cursor">█</tspan></text>
    </g>
    <g clip-path="url(#clip3)">
      <text x="210" y="35" class="typed-text text-3">Flask Developer...<tspan class="cursor">█</tspan></text>
    </g>
    <g clip-path="url(#clip4)">
      <text x="210" y="35" class="typed-text text-4">React Developer...<tspan class="cursor">█</tspan></text>
    </g>
    <g clip-path="url(#clip5)">
      <text x="210" y="35" class="typed-text text-5">Open Source Learner...<tspan class="cursor">█</tspan></text>
    </g>
  </g>
</svg>
