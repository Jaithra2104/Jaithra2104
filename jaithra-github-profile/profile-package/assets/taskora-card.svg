<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="420" height="180">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect width="420" height="180" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Terminal Window Controls -->
  <g transform="translate(15, 18)">
    <circle cx="0" cy="0" r="4.5" fill="#ff5f56" />
    <circle cx="12" cy="0" r="4.5" fill="#ffbd2e" />
    <circle cx="24" cy="0" r="4.5" fill="#27c93f" />
  </g>
  
  <!-- Project Metadata -->
  <text x="18" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="bold" fill="#f1f5f9">Taskora</text>
  <text x="18" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" letter-spacing="0.5">Modern Task Management Platform</text>
  
  <!-- Project Description details -->
  <g transform="translate(18, 92)" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">
    <text x="0" y="0">Click repository to view the full codebase,</text>
    <text x="0" y="14">setup instructions, and documentation.</text>
  </g>
  
  <!-- Tech Stack Section -->
  
    <g transform="translate(18, 135)">
      <rect width="44" height="22" rx="4" fill="#1e1b4b" stroke="rgba(255,255,255,0.04)" />
      <text x="22.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">React</text>
    </g>
    <g transform="translate(68, 135)">
      <rect width="56" height="22" rx="4" fill="#06202c" stroke="rgba(255,255,255,0.04)" />
      <text x="28.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#22d3ee" text-anchor="middle">Node.js</text>
    </g>
    <g transform="translate(130, 135)">
      <rect width="62" height="22" rx="4" fill="#1e1b4b" stroke="rgba(255,255,255,0.04)" />
      <text x="31.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">Firebase</text>
    </g>
    <g transform="translate(198, 135)">
      <rect width="56" height="22" rx="4" fill="#06202c" stroke="rgba(255,255,255,0.04)" />
      <text x="28.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#22d3ee" text-anchor="middle">Express</text>
    </g>
  
  <!-- Divider -->
  <line x1="275" y1="25" x2="275" y2="155" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Dynamic Right-side Animation Area -->
  
  <g transform="translate(290, 45)">
    <rect x="5" y="5" width="12" height="12" rx="2" fill="none" stroke="#22d3ee" stroke-width="1.5" />
    <path d="M7 11 l2 2 l4 -5" fill="none" stroke="#22d3ee" stroke-width="1.5" />
    <text x="24" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-decoration="line-through">Deploy API</text>
    
    <rect x="5" y="25" width="12" height="12" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    <path d="M7 31 l2 2 l4 -5" fill="none" stroke="#a78bfa" stroke-width="1.5">
      <animate attributeName="stroke-dasharray" values="15;15" dur="4s" repeatCount="indefinite" />
      <animate attributeName="stroke-dashoffset" values="15;0;0;15" dur="4s" repeatCount="indefinite" />
    </path>
    <text x="24" y="35" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f1f5f9">
      <animate attributeName="fill" values="#f1f5f9;#64748b;#64748b;#f1f5f9" dur="4s" repeatCount="indefinite" />
    </text>
    <text x="24" y="35" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f1f5f9">Sync DB</text>
    <line x1="24" y1="31" x2="68" y2="31" stroke="#64748b" stroke-width="1">
      <animate attributeName="stroke-dasharray" values="50;50" dur="4s" repeatCount="indefinite" />
      <animate attributeName="stroke-dashoffset" values="50;0;0;50" dur="4s" repeatCount="indefinite" />
    </line>
    
    <rect x="5" y="45" width="12" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="24" y="55" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f1f5f9">Build UI</text>
    
    <rect x="5" y="70" width="90" height="6" rx="3" fill="#1e293b" />
    <rect x="5" y="70" width="30" height="6" rx="3" fill="#a78bfa">
      <animate attributeName="width" values="30;70;70;30" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="50" y="90" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" text-anchor="middle">Task Flow</text>
  </g>
</svg>