<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect width="420" height="180" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Terminal Window Controls -->
  <g transform="translate(15, 18)">
    <circle cx="0" cy="0" r="4.5" fill="#ff5f56" />
    <circle cx="12" cy="0" r="4.5" fill="#ffbd2e" />
    <circle cx="24" cy="0" r="4.5" fill="#27c93f" />
  </g>
  
  <!-- Project Metadata -->
  <text x="18" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="bold" fill="#f1f5f9">Friday</text>
  <text x="18" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" letter-spacing="0.5">AI Personal Voice Assistant</text>
  
  <!-- Project Description details -->
  <g transform="translate(18, 92)" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">
    <text x="0" y="0">Click repository to view the full codebase,</text>
    <text x="0" y="14">setup instructions, and documentation.</text>
  </g>
  
  <!-- Tech Stack Section -->
  
    <g transform="translate(18, 135)">
      <rect width="50" height="22" rx="4" fill="#1e1b4b" stroke="rgba(255,255,255,0.04)" />
      <text x="25.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(74, 135)">
      <rect width="122" height="22" rx="4" fill="#06202c" stroke="rgba(255,255,255,0.04)" />
      <text x="61.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#22d3ee" text-anchor="middle">Speech Recognition</text>
    </g>
    <g transform="translate(202, 135)">
      <rect width="32" height="22" rx="4" fill="#1e1b4b" stroke="rgba(255,255,255,0.04)" />
      <text x="16.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">NLP</text>
    </g>
    <g transform="translate(240, 135)">
      <rect width="56" height="22" rx="4" fill="#06202c" stroke="rgba(255,255,255,0.04)" />
      <text x="28.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#22d3ee" text-anchor="middle">Pyttsx3</text>
    </g>
  
  <!-- Divider shifted to 275 -->
  <line x1="275" y1="25" x2="275" y2="155" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Dynamic Right-side Animation Area (Center shifted to 348) -->
  
  <g transform="translate(290, 0)">
    <!-- Voice waves -->
    <rect x="10" y="70" width="6" height="40" rx="3" fill="#a78bfa">
      <animate attributeName="height" values="30;80;40;60;30" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="75;50;70;60;75" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="55" width="6" height="70" rx="3" fill="#22d3ee">
      <animate attributeName="height" values="70;30;90;40;70" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="55;75;45;70;55" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="34" y="40" width="6" height="100" rx="3" fill="#818cf8">
      <animate attributeName="height" values="100;40;80;50;100" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="40;70;50;65;40" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="46" y="60" width="6" height="60" rx="3" fill="#22d3ee">
      <animate attributeName="height" values="50;90;40;80;50" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="65;45;70;50;65" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="58" y="75" width="6" height="30" rx="3" fill="#a78bfa">
      <animate attributeName="height" values="30;60;20;50;30" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="75;60;80;65;75" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <text x="37" y="145" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#64748b" text-anchor="middle">listening...</text>
  </g>
</svg>