<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect width="420" height="180" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Terminal Window Controls -->
  <g transform="translate(15, 18)">
    <circle cx="0" cy="0" r="4.5" fill="#ff5f56" />
    <circle cx="12" cy="0" r="4.5" fill="#ffbd2e" />
    <circle cx="24" cy="0" r="4.5" fill="#27c93f" />
  </g>
  
  <!-- Project Metadata -->
  <text x="18" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="bold" fill="#f1f5f9">SmartRank</text>
  <text x="18" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" letter-spacing="0.5">Rule-Based College Predictor</text>
  
  <!-- Project Description details -->
  <g transform="translate(18, 92)" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">
    <text x="0" y="0">Click repository to view the full codebase,</text>
    <text x="0" y="14">setup instructions, and documentation.</text>
  </g>
  
  <!-- Tech Stack Section -->
  
    <g transform="translate(18, 135)">
      <rect width="50" height="22" rx="4" fill="#1e1b4b" stroke="rgba(255,255,255,0.04)" />
      <text x="25.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(74, 135)">
      <rect width="44" height="22" rx="4" fill="#06202c" stroke="rgba(255,255,255,0.04)" />
      <text x="22.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#22d3ee" text-anchor="middle">Flask</text>
    </g>
    <g transform="translate(124, 135)">
      <rect width="80" height="22" rx="4" fill="#1e1b4b" stroke="rgba(255,255,255,0.04)" />
      <text x="40.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">Rule Engine</text>
    </g>
    <g transform="translate(210, 135)">
      <rect width="62" height="22" rx="4" fill="#06202c" stroke="rgba(255,255,255,0.04)" />
      <text x="31.0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#22d3ee" text-anchor="middle">HTML/CSS</text>
    </g>
  
  <!-- Divider shifted to 275 -->
  <line x1="275" y1="25" x2="275" y2="155" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Dynamic Right-side Animation Area (Center shifted to 348) -->
  
  <g transform="translate(348, 85)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="6" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#cardGrad)" stroke-width="6" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201">
      <animate attributeName="stroke-dashoffset" values="201;35;35;201" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <!-- Prediction matching percentage -->
    <text x="0" y="5" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
      <animate attributeName="textContent" values="0%;82%;82%;0%" dur="3.5s" repeatCount="indefinite" />
      82%
    </text>
    <text x="0" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#64748b" text-anchor="middle">match score</text>
  </g>
</svg>