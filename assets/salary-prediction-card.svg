<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect width="420" height="180" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Terminal Window Controls -->
  <g transform="translate(15, 18)">
    <circle cx="0" cy="0" r="4.5" fill="#ff5f56" />
    <circle cx="12" cy="0" r="4.5" fill="#ffbd2e" />
    <circle cx="24" cy="0" r="4.5" fill="#27c93f" />
  </g>
  
  <!-- Project Metadata -->
  <text x="18" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="bold" fill="#f1f5f9">Salary Prediction</text>
  <text x="18" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" letter-spacing="0.5">ML Web Application & API</text>
  
  <!-- Project Description details -->
  <!-- We wrap long text or split it -->
  <g transform="translate(18, 92)" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">
    <text x="0" y="0">Click repository to view the full codebase,</text>
    <text x="0" y="14">setup instructions, and documentation.</text>
  </g>
  
  <!-- Tech Stack Section -->
  
    <g transform="translate(18, 135)">
      <rect width="78" height="22" rx="4" fill="#1e1b4b" stroke="rgba(255,255,255,0.04)" />
      <text x="39" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(103, 135)">
      <rect width="78" height="22" rx="4" fill="#06202c" stroke="rgba(255,255,255,0.04)" />
      <text x="39" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#22d3ee" text-anchor="middle">Scikit-Learn</text>
    </g>
    <g transform="translate(188, 135)">
      <rect width="78" height="22" rx="4" fill="#1e1b4b" stroke="rgba(255,255,255,0.04)" />
      <text x="39" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">Flask</text>
    </g>
    <g transform="translate(273, 135)">
      <rect width="78" height="22" rx="4" fill="#06202c" stroke="rgba(255,255,255,0.04)" />
      <text x="39" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold" fill="#22d3ee" text-anchor="middle">Bootstrap</text>
    </g>
  
  <!-- Divider -->
  <line x1="265" y1="25" x2="265" y2="155" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Dynamic Right-side Animation Area (Center 340,90) -->
  
  <g transform="translate(285, 35)">
    <rect width="100" height="90" fill="#080c14" rx="4" stroke="rgba(255,255,255,0.03)" />
    
    <!-- Scatter Points -->
    <circle cx="20" cy="70" r="2.5" fill="#22d3ee" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="35" cy="55" r="2.5" fill="#22d3ee" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="50" r="2.5" fill="#22d3ee" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="65" cy="30" r="2.5" fill="#22d3ee" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="20" r="2.5" fill="#22d3ee" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/></circle>
    
    <!-- Regression line -->
    <line x1="10" y1="80" x2="90" y2="15" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="110" stroke-dashoffset="110">
      <animate attributeName="stroke-dashoffset" values="110;0;0;110" dur="3.5s" repeatCount="indefinite" />
    </line>
    
    <text x="50" y="105" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" text-anchor="middle">regression fits</text>
  </g>
</svg>