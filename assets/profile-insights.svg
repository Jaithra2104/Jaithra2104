<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260" style="background: transparent;">
  <defs>
    <!-- Blinking Cursor Animation -->
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      .goal-text {
        font-family: 'Segoe UI', Monaco, Consolas, monospace;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .goal-sub {
        font-family: 'Segoe UI', Monaco, Consolas, monospace;
        font-size: 11px;
        fill: #94a3b8;
      }
      .json-key {
        font-family: Consolas, Monaco, 'Courier New', monospace;
        font-size: 11.5px;
        fill: #22d3ee;
      }
      .json-val {
        font-family: Consolas, Monaco, 'Courier New', monospace;
        font-size: 11.5px;
        fill: #e2e8f0;
      }
      .quote-text {
        font-family: 'Georgia', serif;
        font-size: 13.5px;
        font-style: italic;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Main Terminal Box -->
  <rect x="1" y="1" width="838" height="258" rx="8" fill="#111722" stroke="#30363d" stroke-width="1.5" />

  <!-- Top Bar -->
  <path d="M 1 9 A 8 8 0 0 1 9 1 L 831 1 A 8 8 0 0 1 839 9 L 839 30 L 1 30 Z" fill="#0d1322" />
  
  <!-- Window Dots -->
  <circle cx="20" cy="15" r="5" fill="#ff5f56" />
  <circle cx="35" cy="15" r="5" fill="#ffbd2e" />
  <circle cx="50" cy="15" r="5" fill="#27c93f" />
  
  <!-- Window Title -->
  <text x="420" y="19" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">jaithra@dashboard: ~</text>

  <!-- Vertical Divider -->
  <line x1="420" y1="30" x2="420" y2="260" stroke="#30363d" stroke-width="1" />

  <!-- ================= LEFT PANEL: OPEN SOURCE GOALS ================= -->
  <text x="25" y="62" fill="#a78bfa" font-size="13" font-weight="bold" font-family="monospace">&gt; open_source_goals.sh</text>

  <!-- Goal 1 -->
  <!-- Checkbox -->
  <rect x="25" y="86" width="16" height="16" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.5" />
  <!-- Checkmark -->
  <path d="M 28 94 L 32 98 L 38 90" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="52" y="99" class="goal-text" font-weight="bold">Active Collaboration</text>
  <text x="52" y="114" class="goal-sub">Contribute meaningful PRs to active open-source repos.</text>

  <!-- Goal 2 -->
  <!-- Checkbox -->
  <rect x="25" y="136" width="16" height="16" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.5" />
  <!-- Checkmark -->
  <path d="M 28 144 L 32 148 L 38 140" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="52" y="149" class="goal-text" font-weight="bold">Project Maintenance</text>
  <text x="52" y="164" class="goal-sub">Maintain at least one well-documented personal repository.</text>

  <!-- Goal 3 -->
  <!-- Checkbox -->
  <rect x="25" y="186" width="16" height="16" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.5" />
  <!-- Checkmark -->
  <path d="M 28 194 L 32 198 L 38 190" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="52" y="199" class="goal-text" font-weight="bold">Build in Public</text>
  <text x="52" y="214" class="goal-sub">Share coding progress and insights with the community.</text>


  <!-- ================= RIGHT PANEL TOP: FUN FACTS ================= -->
  <text x="445" y="62" fill="#a78bfa" font-size="13" font-weight="bold" font-family="monospace">&gt; fun_facts.json</text>

  <g transform="translate(445, 80)">
    <text x="0" y="10" class="json-key">"creative_mode": <tspan class="json-val">"Late Night &amp; Good Playlists",</tspan></text>
    <text x="0" y="28" class="json-key">"passion_index": <tspan class="json-val">"Shipping side projects to production",</tspan></text>
    <text x="0" y="46" class="json-key">"code_philosophy": <tspan class="json-val">"Clean code is respect for the future self"</tspan></text>
  </g>

  <!-- Horizontal Divider -->
  <line x1="420" y1="145" x2="840" y2="145" stroke="#30363d" stroke-width="1" />


  <!-- ================= RIGHT PANEL BOTTOM: QUOTE ================= -->
  <text x="445" y="177" fill="#a78bfa" font-size="13" font-weight="bold" font-family="monospace">&gt; quote.txt</text>

  <!-- Quote Bubble / Display -->
  <text x="445" y="202" class="quote-text">"First, solve the problem. Then, write the code."</text>
  <text x="445" y="222" class="quote-text" fill="#94a3b8" font-size="12" font-weight="bold">— John Johnson</text>
  
  <!-- Blinking Cursor -->
  <rect x="740" y="190" width="7" height="14" fill="#22d3ee" class="cursor" />
</svg>
