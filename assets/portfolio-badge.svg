<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 40" width="170" height="40" style="background: transparent;">
  <defs>
    <style>
      @keyframes glow-purple {
        0%, 100% { stroke: #30363d; }
        50% { stroke: #a78bfa; }
      }
      .badge-rect {
        animation: glow-purple 4s ease-in-out infinite;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        fill: #e2e8f0;
        letter-spacing: 1px;
      }
    </style>
  </defs>
  <!-- Background Rect with pulsing stroke -->
  <rect x="1" y="1" width="168" height="38" rx="6" fill="#111722" class="badge-rect" stroke-width="1.5" />
  
  <!-- Portfolio Briefcase Icon -->
  <g transform="translate(18, 10) scale(0.833)">
    <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z" fill="#a78bfa" />
  </g>
  
  <!-- Label -->
  <text x="48" y="24" class="badge-text">PORTFOLIO</text>
</svg>
