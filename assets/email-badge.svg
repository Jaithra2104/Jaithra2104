<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 40" width="170" height="40" style="background: transparent;">
  <defs>
    <style>
      @keyframes glow-cyan {
        0%, 100% { stroke: #30363d; }
        50% { stroke: #22d3ee; }
      }
      .badge-rect {
        animation: glow-cyan 4s ease-in-out infinite;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        fill: #e2e8f0;
        letter-spacing: 1px;
      }
    </style>
  </defs>
  <!-- Background Rect with pulsing stroke -->
  <rect x="1" y="1" width="168" height="38" rx="6" fill="#111722" class="badge-rect" stroke-width="1.5" />
  
  <!-- Email Icon -->
  <g transform="translate(18, 10) scale(0.833)">
    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="#22d3ee" />
  </g>
  
  <!-- Label -->
  <text x="48" y="24" class="badge-text">EMAIL</text>
</svg>
